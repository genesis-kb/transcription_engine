name: PR policy check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

# pull_request_target runs in the base repo's context so it can label fork PRs.
# It never checks out or runs PR code. It only reads the PR body and commit messages.
permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || "").replace(/<!--[\s\S]*?-->/g, "");
            const problems = [];

            const section = (name) => {
              const re = new RegExp(`##\\s*${name}[^\\n]*\\n([\\s\\S]*?)(?=\\n##\\s|$)`, "i");
              const m = body.match(re);
              return m ? m[1].trim() : "";
            };
            const ticked = (label) =>
              new RegExp(`-\\s*\\[[xX]\\]\\s*\\*\\*${label}\\*\\*`).test(body);

            // 1. Descriptions written in the author's own words (minimum effort bar)
            if (section("Why").length < 40)          problems.push("**Why**: explain the problem in at least a sentence or two, and link the issue.");
            if (section("What changed").length < 40) problems.push("**What changed**: describe your approach.");
            if (section("How I tested").length < 20) problems.push("**How I tested**: say what you ran or checked.");

            // 2. AI disclosure: exactly one box ticked
            const choices = ["None", "Assisted", "Generated"].filter(ticked);
            if (choices.length !== 1) problems.push("**AI usage**: tick exactly one box.");
            const usesAI = choices.some(c => c !== "None");

            if (usesAI) {
              const details = (body.match(/\*\*AI details\*\*[^\n]*\n([\s\S]*?)(?=\n##\s|$)/i) || [,""])[1].trim();
              if (details.length < 10) problems.push("**AI details**: name the tool and which parts it produced.");
            }

            // 3. Author checklist
            if (!/-\s*\[[xX]\]\s*I have read and understand every line/i.test(body))
              problems.push("**Author checklist**: confirm that you understand every line of the diff.");

            // 4. Cross-check commits for AI trailers against the disclosure
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
            });
            const aiTrailer = /(co-authored-by:.*(claude|copilot|cursor|chatgpt|openai|gemini|codex|devin|aider))|generated with \[?claude/i;
            const aiCommits = commits.filter(c => aiTrailer.test(c.commit.message));
            if (aiCommits.length && choices.includes("None"))
              problems.push(`Commits contain AI co-author trailers (${aiCommits.length}), but AI usage is marked **None**.`);

            // 5. Label AI-assisted PRs so reviewers can prioritise and look more closely
            if (usesAI || aiCommits.length) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: pr.number, labels: ["ai-assisted"],
                });
              } catch (e) { core.warning(`Could not add label: ${e.message}`); }
            }

            if (problems.length) {
              core.summary.addHeading("PR policy check failed").addList(problems).addRaw("See AI_POLICY.md.");
              await core.summary.write();
              core.setFailed(problems.join("\n"));
            }
